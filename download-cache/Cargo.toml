[package]
name = "download-cache"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
httpdate = "1"
log = "0.4"
tempfile = "3"
thiserror = "2"
reqwest = { version = "0.12", features = ["gzip"] }
tokio = { version = "1", features = ["fs", "rt-multi-thread", "time"] }

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
