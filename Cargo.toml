[package]
name = "symbolicate-stacks"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
daemonize = "0.5"
env_logger = "0.11"
interprocess = { version = "2", features = ["tokio"] }
lib = { path = "lib" }
log = "0.4"
serde = "1"
serde_json = "1"
term = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
